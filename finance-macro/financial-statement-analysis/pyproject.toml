[project]
name = "financial-statement-analysis"
version = "0.1.0"
description = "A 股财报 PDF 分析 skill：下载、索引、事实合同、指标计算与报告校验"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
