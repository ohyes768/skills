<script>
const REGISTRY_DATA_ID = "registry-data";
const IDB_NAME = "skill-agent-matrix";
const HANDLE_KEY = "html-file";

let REGISTRY = null;
let extraAgents = [];
let assign = {};
let fileHandle = null;
let dirty = false;
let saveTimer = null;
let autoSaveReady = false;

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(db, key) {
  return new Promise((resolve, reject) => {
    const req = db.transaction("handles", "readonly").objectStore("handles").get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbPut(db, key, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readwrite");
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.objectStore("handles").put(value, key);
  });
}

async function storeFileHandle(handle) {
  try {
    await idbPut(await openIDB(), HANDLE_KEY, handle);
  } catch (e) { /* ignore */ }
}

async function restoreFileHandle() {
  if (!("showOpenFilePicker" in window)) return;
  try {
    const handle = await idbGet(await openIDB(), HANDLE_KEY);
    if (!handle) return;
    fileHandle = handle;
    if ((await handle.queryPermission({ mode: "readwrite" })) === "granted") {
      autoSaveReady = true;
      updateLinkHint(true);
    }
  } catch (e) { /* ignore */ }
}

function updateLinkHint(linked) {
  const el = document.getElementById("save-hint");
  if (linked && autoSaveReady) {
    el.hidden = false;
    el.classList.remove("pending", "error");
    el.textContent = dirty ? "已关联文件 · 有未保存修改" : "已关联文件 · 改勾选自动保存";
  } else if (dirty) {
    el.hidden = false;
    el.classList.add("pending");
    el.textContent = "有未保存的修改 · 点保存并选文件";
  } else {
    el.hidden = true;
  }
}

function skillNames() {
  return new Set(REGISTRY.skills.map((s) => s.name));
}

function agentsList() {
  return [...Object.keys(REGISTRY.agents), ...extraAgents];
}

function loadRegistryFromDOM() {
  REGISTRY = JSON.parse(document.getElementById(REGISTRY_DATA_ID).textContent);
}

function initAssignFromRegistry() {
  assign = {};
  for (const a of Object.keys(REGISTRY.agents)) {
    assign[a] = [...(REGISTRY.agents[a].skills || [])];
  }
}

function markDirty() {
  dirty = true;
  updateLinkHint(autoSaveReady);
  scheduleAutoSave();
}

function markClean() {
  dirty = false;
  updateLinkHint(autoSaveReady);
}

function isChecked(agent, skillName) {
  return !!(assign[agent] && assign[agent].includes(skillName));
}

function setChecked(agent, skillName, checked) {
  const set = new Set(assign[agent] || []);
  if (checked) set.add(skillName);
  else set.delete(skillName);
  assign[agent] = [...set];
  markDirty();
  refreshUI();
}

function buildExport() {
  const out = JSON.parse(JSON.stringify(REGISTRY));
  const valid = skillNames();
  const agentsOut = {};
  for (const a of agentsList()) {
    agentsOut[a] = {
      description: (REGISTRY.agents[a] && REGISTRY.agents[a].description) || "",
      skills: (assign[a] || []).filter((n) => valid.has(n)),
    };
  }
  out.agents = agentsOut;
  out.updated = new Date().toISOString().slice(0, 10);
  return out;
}

function patchHtml(html, data) {
  const json = JSON.stringify(data, null, 2);
  const re = /(<script\s+type="application\/json"\s+id="registry-data"\s*>\s*)([\s\S]*?)(\s*<\/script>)/;
  if (!re.test(html)) throw new Error("未找到 registry-data 数据块");
  return html.replace(re, "$1\n" + json + "\n$3");
}

function applySaved(data) {
  REGISTRY = data;
  extraAgents = [];
  initAssignFromRegistry();
  document.getElementById(REGISTRY_DATA_ID).textContent = "\n" + JSON.stringify(data, null, 2) + "\n";
  markClean();
}

function scheduleAutoSave() {
  if (!autoSaveReady || !fileHandle) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveHtml(true), 500);
}

async function ensureFileAccess(needPicker) {
  if (!window.showOpenFilePicker) return false;
  if (!fileHandle && needPicker) {
    [fileHandle] = await window.showOpenFilePicker({
      types: [{ description: "HTML", accept: { "text/html": [".html"] } }],
      multiple: false,
    });
    await storeFileHandle(fileHandle);
  }
  if (!fileHandle) return false;
  let perm = await fileHandle.queryPermission({ mode: "readwrite" });
  if (perm !== "granted") perm = await fileHandle.requestPermission({ mode: "readwrite" });
  if (perm !== "granted") throw new Error("没有写入权限");
  autoSaveReady = true;
  return true;
}

async function saveHtml(silent) {
  const data = buildExport();
  try {
    if (await ensureFileAccess(!silent)) {
      const html = patchHtml(await (await fileHandle.getFile()).text(), data);
      const w = await fileHandle.createWritable();
      await w.write(html);
      await w.close();
      applySaved(data);
      updateLinkHint(true);
      if (!silent) showToast("已保存");
      return;
    }
  } catch (e) {
    if (e.name === "AbortError") return;
    showToast("保存失败：" + e.message);
    return;
  }

  if (silent) return;
  const html = patchHtml("<!DOCTYPE html>\n" + document.documentElement.outerHTML, data);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "skill-agent-matrix.html";
  a.click();
  URL.revokeObjectURL(url);
  applySaved(data);
  showToast("已下载 HTML，用它覆盖原文件");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}

function agentPathLine(agentKey) {
  const cfg = REGISTRY.agents[agentKey];
  if (!cfg || !cfg.skills_dir) return "";
  let path = cfg.skills_dir;
  if (cfg.skills_subdir) path += "/" + cfg.skills_subdir;
  let html = `<span style="font-size:11px;display:block;margin-top:4px;font-family:Consolas,monospace">${esc(path)}</span>`;
  if (cfg.source_repo) {
    html += `<span style="font-size:11px;display:block;font-family:Consolas,monospace;color:var(--muted)">源: ${esc(cfg.source_repo)}</span>`;
  }
  return html;
}

function skillBadge(s) {
  if (s.status === "empty") return '<span class="badge empty">待补充</span>';
  if (s.source === "github") return '<span class="badge github">github</span>';
  return '<span class="badge local">local</span>';
}

function skillMeta(s) {
  if (s.source !== "github") return esc(s.summary || "");
  const ver = [s.latest_version, s.head_commit, s.checked_at].filter(Boolean).join(" · ");
  return (
    esc(s.summary || "") +
    ' · <a href="' + esc(s.repo) + '" target="_blank">' + esc(s.repo) + "</a>" +
    (ver ? " · " + esc(ver) : "")
  );
}

function render() {
  const area = document.getElementById("table-area");
  area.innerHTML = "";
  const agents = agentsList();

  for (const [themeKey, theme] of Object.entries(REGISTRY.themes)) {
    const skills = REGISTRY.skills.filter((s) => s.theme === themeKey);
    if (!skills.length) continue;
    const block = document.createElement("div");
    block.className = "theme-block";
    block.innerHTML = `
      <div class="theme-header">
        <h2>${esc(theme.label || themeKey)}</h2>
        <small>${esc(theme.description || "")} · ${skills.length} 个 skill</small>
      </div>
      <table>
        <thead><tr>
          <th class="skill-col">Skill</th>
          ${agents.map((a) => `
            <th>${esc(a)}${extraAgents.includes(a) ? `<span class="agent-del" data-del-agent="${esc(a)}">×</span>` : ""}
              <input type="checkbox" class="col-all" data-agent="${esc(a)}">
            </th>`).join("")}
        </tr></thead>
        <tbody>
          ${skills.map((s) => `
            <tr class="${s.status === "empty" ? "disabled" : ""}">
              <td class="skill-col">
                <div class="skill-name">${esc(s.name)}${skillBadge(s)}</div>
                <div class="skill-summary">${skillMeta(s)}</div>
              </td>
              ${agents.map((a) => `
                <td><input type="checkbox" class="cell-cb" data-agent="${esc(a)}" data-skill="${esc(s.name)}"
                  ${isChecked(a, s.name) ? "checked" : ""} ${s.status === "empty" ? "disabled" : ""}></td>`).join("")}
            </tr>`).join("")}
        </tbody>
      </table>`;
    area.appendChild(block);
  }

  area.querySelectorAll(".cell-cb").forEach((cb) => {
    cb.addEventListener("change", () => setChecked(cb.dataset.agent, cb.dataset.skill, cb.checked));
  });
  area.querySelectorAll(".col-all").forEach((cb) => {
    cb.addEventListener("change", () => {
      const agent = cb.dataset.agent;
      cb.closest("table").querySelectorAll(`.cell-cb[data-agent='${agent}']`).forEach((cell) => {
        if (!cell.disabled && cell.checked !== cb.checked) {
          cell.checked = cb.checked;
          setChecked(agent, cell.dataset.skill, cb.checked);
        }
      });
      refreshUI();
    });
  });
  area.querySelectorAll(".agent-del").forEach((el) => {
    el.addEventListener("click", () => {
      const a = el.dataset.delAgent;
      if (!confirm(`移除 agent 列「${a}」？`)) return;
      extraAgents = extraAgents.filter((x) => x !== a);
      delete assign[a];
      markDirty();
      render();
    });
  });
  refreshUI();
}

function refreshUI() {
  const active = REGISTRY.skills.filter((s) => s.status === "active").length;
  document.getElementById("stats").innerHTML = agentsList().map((a) => `
    <div class="stat-card">
      <span>${esc(a)}</span>
      <b>${(assign[a] || []).length} <span style="font-size:12px;color:var(--muted)">/ ${active}</span></b>
      <span>${esc((REGISTRY.agents[a] && REGISTRY.agents[a].description) || "（新增 agent）")}</span>
      ${agentPathLine(a)}
    </div>`).join("");

  document.querySelectorAll(".col-all").forEach((cb) => {
    const agent = cb.dataset.agent;
    const cells = [...cb.closest("table").querySelectorAll(`.cell-cb[data-agent='${agent}']`)].filter((c) => !c.disabled);
    const n = cells.filter((c) => c.checked).length;
    cb.checked = cells.length > 0 && n === cells.length;
    cb.indeterminate = n > 0 && n < cells.length;
  });

  document.getElementById("footer").textContent =
    `v${REGISTRY.version}（${REGISTRY.updated}）· ${REGISTRY.skills.length} 个 skill · agents：${agentsList().join(" / ")}`;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2400);
}

document.getElementById("btn-save").addEventListener("click", () => saveHtml(false));
document.getElementById("btn-add-agent").addEventListener("click", () => {
  const key = (prompt("新 agent 名称（英文，如 claudecode）：") || "").trim();
  if (!key) return;
  if (!/^[a-zA-Z][a-zA-Z0-9_-]*$/.test(key)) { showToast("名称格式不正确"); return; }
  if (agentsList().includes(key)) { showToast("已存在"); return; }
  extraAgents.push(key);
  assign[key] = [];
  markDirty();
  render();
});
document.getElementById("btn-reset").addEventListener("click", () => {
  loadRegistryFromDOM();
  extraAgents = [];
  initAssignFromRegistry();
  markClean();
  render();
  showToast("已撤销未保存的修改");
});

loadRegistryFromDOM();
initAssignFromRegistry();
restoreFileHandle().then(render);

</script>
</body>
</html>
